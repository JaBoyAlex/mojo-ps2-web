name: Public player · build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  browser-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned generic WebAssembly toolchain
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/emscripten-core/emsdk.git userdata/browser-sdk
          git -C userdata/browser-sdk checkout dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
          userdata/browser-sdk/emsdk install 6.0.11
          userdata/browser-sdk/emsdk activate 6.0.11
      - name: Build independent host and browser preparation tools
        run: |
          source userdata/browser-sdk/emsdk_env.sh
          python scripts/build_browser_tools.py
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); from verify_publication import verify_browser_tools; verify_browser_tools(Path('userdata/browser-tools-public'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-tools
          path: userdata/browser-tools-public
          if-no-files-found: error
  preparation-downloads:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build independent preparation tools only
        run: python scripts/build_preparer.py --windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preparation-downloads
          path: userdata/preparer/prepare-mojo-*.zip
          if-no-files-found: error
  build:
    needs: [preparation-downloads, browser-tools]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Test frontend and save recovery
        run: |
          node --check web/launcher.mjs
          node tests/web_disc.mjs
          node tests/web_audio.mjs
          node tests/web_settings.mjs
          node tests/web_linked_save.mjs
          node tests/runtime_package.mjs
          python -m unittest discover -s tests -p test_preparation.py
          python -m unittest discover -s tests -p test_publication.py
          node --check web/preparation-worker.mjs
          node --check web/preparation-frame.mjs
          bash -n preparer/prepare.sh
          bash -n preparer/launch-linux.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preparation-downloads
          path: userdata/preparer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-tools
          path: userdata/browser-tools-public
      - name: Assemble the public player and independent tools
        run: |
          python scripts/build_site.py
          python scripts/verify_publication.py --git
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public launcher
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
